<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body {
            background-color: cadetblue;
        }
    </style>
</head>
<body>
    <a href="#" onclick="clicou()">Clique em mim</a>
    <div id="saida"></div>

    <script>
        let cont = 1
        function clicou() {
            let s = window.document.getElementById("saida")
            if (cont == 1) {
                s.innerHTML = "<p>Você clicou!</p>"
            } else {
                s.innerHTML = `<p>Você clicou! x${cont}</p>`
            }
            cont++
        }
    </script>
</body>
</html>
