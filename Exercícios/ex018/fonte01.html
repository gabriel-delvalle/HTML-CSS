<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes com Google Fonts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Slabo+27px&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap');

        body {
            font-family: 'Comfortaa', sans-serif;
            font-size: 1em;
            font-weight: 400;
        }

        h1 {
            font-family: 'Slabo 27px', serif;
            font-size: 2em;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Eaque ducimus aut accusantium vel alias sit temporibus molestias fugiat id quam saepe facere inventore, doloribus nostrum sequi quasi laudantium, fugit repellendus.</p>
</body>
</html>
