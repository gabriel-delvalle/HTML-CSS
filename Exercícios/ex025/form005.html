<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Formulários</h1>
    <form action="cadastro.php" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="i-masculino" value="M"><label for="i-masculino">Masculino</label><br>
            <input type="radio" name="sexo" id="i-feminino" value="F"><label for="i-feminino" value="F">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="futebol" id="i-futebol"><label for="i-futebol">Futebol</label><br>
            <input type="checkbox" name="basquete" id="i-basquete"><label for="i-basquete">Basquete</label><br>
            <input type="checkbox" name="volei" id="i-volei"><label for="i-volei">Vôlei</label><br>
            <input type="checkbox" name="natacao" id="i-natacao"><label for="i-natacao">Natação</label><br>
            <input type="checkbox" name="tenis" id="i-tenis"><label for="i-tenis">Tênis</label>
        </fieldset>
        <p>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </p>
    </form>
</body>
</html>
