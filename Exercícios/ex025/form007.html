<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="i-estado">Estado:</label>
            <select name="estado" id="i-estado">
                <optgroup label="Região Sudeste">
                    <option value="sp">São Paulo</option>
                    <option value="rj">Rio de Janeiro</option>
                    <option value="mg">Minas Gerais</option>
                    <option value="es">Espírito Santo</option>
                </optgroup>
                <optgroup label="Região Sul">
                    <option value="sc">Santa Catarina</option>
                    <option value="pr">Paraná</option>
                    <option value="rs">Rio Grande do Sul</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="i-prof">Profissão:</label>
            <input type="text" name="prof" id="i-prof" list="profs" autocomplete="off">
            <datalist id="profs">
                <option value="adm">Administrador</option>
                <option value="dev">Desenvolvedor</option>
                <option value="prof">Professor</option>
            </datalist>
        </p>
        <p>
            <label for="i-msg">Mensagem:</label><br>
            <textarea name="msg" id="i-msg" cols="30" rows="10" placeholder="Digite uma mensagem..."></textarea>
        </p>
        <p>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </p>
    </form>
</body>
</html>
