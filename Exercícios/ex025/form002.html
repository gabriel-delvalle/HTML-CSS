<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="i-usuario">Usuário: </label> <input type="text" name="usuario" id="i-usuario" required maxlength="10" placeholder="Nome do usuário" autocomplete="username">
        </p>
        <p>
            <label for="i-senha">Senha: </label> <input type="password" name="senha" id="i-senha" required minlength="15" placeholder="Senha" autocomplete="new-password">
        </p>
        <p>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </p>
    </form>
</body>
</html>
