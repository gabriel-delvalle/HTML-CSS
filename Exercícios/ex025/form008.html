<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php">
        <p>
            <label for="i-num1">Número 1: </label>
            <input type="number" name="num1" id="i-num1" min="0" max="50" required oninput="document.getElementById('i-soma').innerHTML = Number(this.value) + Number(document.getElementById('i-num2').value)">
        </p>
        <p>
            <label for="i-num2">Número 2: </label>
            <input type="number" name="num2" id="i-num2" min="0" max="50" required oninput="document.getElementById('i-soma').innerHTML = Number(document.getElementById('i-num1').value) + Number(this.value)">
        </p>
        <p>
            <label for="i-soma">Soma:</label>
            <output name="soma" id="i-soma">0</output>
        </p>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
