<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="i-ano">Ano de Nascimento:</label>
            <input type="number" name="ano" id="i-ano" min="1900" max="2026" placeholder="Ano" oninput="document.getElementById('i-idade').innerHTML = 2026 - this.value"> 
        </p>
        <p>
            <label for="i-idade">Idade: </label>
            <output id="i-idade">0</output>
        </p>
        <p>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </p>
    </form>
</body>
</html>
