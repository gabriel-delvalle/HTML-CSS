<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="i-cor">Cor:</label>
            <input type="color" name="cor" id="i-cor" value="#00ff00">
        </p>
        <p>
            <label for="i-nivel">Nível de Satisfação:</label>
            <input type="range" name="nivel" id="i-nivel" min="0" max="5" value="0">
        </p>
        <p>
            <label for="i-foto">Foto do Perfil: </label>
            <input type="file" name="foto" id="i-foto">
        </p>
        <p>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </p>
    </form>
</body>
</html>
